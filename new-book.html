<!doctype html>
<html lang="en">
    <head>
        <title>New Book</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <style>#debug *{border: 1px dashed black;}</style>
    </head>

    <body id="">
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container-fluid ">
                    <a class="navbar-brand d-flex justify-content-center align-items-center" href="index.html">
                        <img src="./assets/img/duck.png" alt="duck" class="img-fluid" width="50">
                    </a>
                    <button
                        class="navbar-toggler d-lg-none"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapsibleNavId"
                        aria-controls="collapsibleNavId"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="collapsibleNavId">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                <a class="nav-link active" href="index.html" aria-current="page">Catalogo Libri
                                    <span class="visually-hidden">(current)</span>  <!--only useful x screenreaders!-->
                                </a>
                            </li>
                            <li class="nav-item ">
                                <a class="nav-link" href="#">Anagrafica Utenti</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Storico Prestiti</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Help</a>
                            </li>
                        </ul>
                        <form class="d-flex my-2 my-lg-0">
                            <input
                                class="form-control me-sm-2"
                                type="text"
                                placeholder="Cerca"
                            />
                            <button
                                class="btn btn-outline-light my-2 my-sm-0 border-light"
                                type="submit"
                            >
                                Search
                            </button>
                        </form>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <div class="container my-4">
                <h2 class="mb-3">Nuovo Libro</h2>
                <div class="row ">
                    <div class="col-6 mb-3">
                        <label for="author_name" class="form-label">Nome Autore</label>
                        <input
                            type="text"
                            class="form-control"
                            name="author_name"
                            id="author_name"
                            aria-describedby="smalltagName"
                            placeholder="Inserisci il nome dell'autore"
                        />
                    </div>
                    <div class="col-6 mb-3">
                        <label for="author_surname" class="form-label">Cognome Autore</label>
                        <input
                            type="text"
                            class="form-control"
                            name="author_surname"
                            id="author_surname"
                            aria-describedby="smalltagSurname"
                            placeholder="Inserisci il cognome dell'autore"
                        />
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 mb-3">
                        <label for="title" class="form-label">Titolo</label>
                        <input
                            type="text"
                            class="form-control"
                            name="title"
                            id="title"
                            aria-describedby="smalltagTitle"
                            placeholder="Inserisci il titolo del libro"
                        />
                        <small id="smalltagTitle" class="form-text text-muted">Titolo versione italiana</small>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 col-md-4 mb-3">
                        <label for="dropdownMenu" class="form-label">Genere</label>
                        <select class="form-select" id="genre" name="dropdownMenu" aria-label="screen readers this is genre">
                          <option selected>Scegli il genere</option>
                          <option value="1">Action</option>
                          <option value="2">Comedy</option>
                          <option value="3">Thriller</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4 mb-3">
                        <label for="year" class="form-label">Anno di pubblicazione</label>
                        <input 
                            type="text"
                            class="form-control"
                            name="year"
                            id="year"
                            aria-describedby="smalltagYear"
                            placeholder="Inserisci l'anno"
                        />
                    </div>
                    <div class="col-12 col-md-4 mb-3">
                        <label for="isbn" class="form-label">ISBN</label>
                        <input
                            type="text"
                            class="form-control"
                            name="isbn"
                            id="isbn"
                            aria-describedby="smalltagIsbn"
                            placeholder="Inserisci il codice ISBN"
                        />
                    </div>
                </div>

                <hr>

                <div class="row">
                    <div class="col-12 mb-3">
                        <label for="note">Note</label>
                        <textarea
                            class="form-control"
                            rows="5"
                            name="note"
                            id="note"
                            aria-describedby="smalltagNote"
                            placeholder="Inserisci eventuali note sul libro"
                        ></textarea>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input
                        type="checkbox"
                        name="isdigital"
                        id="isdigital"
                        value="1"
                        style="margin-left: -1.3rem;"
                    />
                    <label class="form-check-label" for="isdigital">Disponibile anche in digitale</label>
                </div>
                <button
                    type="submit"
                    class=" btn btn-primary" 
                >Aggiungi libro</button>
            </div>

        </main>
        <footer>
            
        </footer>
        
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
